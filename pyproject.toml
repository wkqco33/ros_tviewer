[project]
name = "ros_tviewer"
version = "0.1.1"
description = "ROS 2 카메라 토픽을 터미널에서 재생하는 뷰어"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "seo.youngchae" }]
keywords = ["ros2", "camera", "terminal", "tui", "viewer", "rclpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Terminals",
]
dependencies = [
    "wpyconf",
    "wpylog",
    "wpycli",
    "tcamviewer>=0.2.3",
    "numpy",
    "opencv-python-headless",
]

[project.scripts]
ros-tviewer = "ros_tviewer.main:main"

[project.urls]
Homepage = "https://github.com/wkqco33/ros_tviewer"
Repository = "https://github.com/wkqco33/ros_tviewer"
Issues = "https://github.com/wkqco33/ros_tviewer/issues"
Changelog = "https://github.com/wkqco33/ros_tviewer/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = ["ruff", "pytest"]
