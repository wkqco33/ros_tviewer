name: publish

on:
  release:
    types: [published]
  workflow_dispatch: # 수동 재배포 (릴리스 재실행은 원본 워크플로우 SHA를 재사용함)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI Trusted Publishing (OIDC) — 비밀 토큰 불필요
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install system dependencies
        # tcamviewer sdist 빌드에 cmake + FFmpeg dev 라이브러리 필요
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Build
        run: uv build
        env:
          UV_NO_CACHE: "1" # 캐시 독립 빌드 (cache poisoning 공격 표면 제거)

      - name: Publish to PyPI
        # v1.14.2 — 이전 버전(v1.12.x)의 twine은 hatchling이 생성하는
        # Metadata-Version 2.5를 거부하므로 신규 버전 유지 필수
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2