name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Install system dependencies
        # tcamviewer sdist 빌드에 cmake + FFmpeg dev 라이브러리 필요
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --group dev
          else
            uv sync --group dev
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
